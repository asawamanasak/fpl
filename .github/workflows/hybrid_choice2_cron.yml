name: Hybrid Choice 2 Real-Time Engine

on:
  schedule:
    # Offset 15-minute schedule (minute 8, 23, 38, 53) to bypass GitHub runner peak queue congestion
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-choice-2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute 15-Min Choice 2 Autonomous Optimizer
        run: |
          python auto_sync_choice2.py

      - name: Commit and Push Changes with Cloud Rebase Guard
        run: |
          git config --global user.name "Hybrid-Choice2-Bot"
          git config --global user.email "hybrid-bot@gemini-united.local"
          git add data/ index.html fpl_gw*.html
          if git diff --staged --quiet; then
            echo "Smart Commit: No substantive FPL changes detected. Skipped commit to preserve GitHub runner quota."
          else
            git commit -m "[Hybrid Real-Time Sync] Live FPL updates detected via offset schedule"
            git pull --rebase origin main || true
            git push origin main
          fi
